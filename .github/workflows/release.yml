name: Release image

# Builds the production image and publishes it to GitHub Container Registry:
#   push to main  -> ghcr.io/<owner>/felcra-profiling:main and :sha-<commit>   (deploy to staging)
#   tag v1.2.3    -> ghcr.io/<owner>/felcra-profiling:1.2.3 and :latest          (deploy to production)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/felcra-profiling
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must start and answer its health check (with a throwaway database).
      - name: Smoke test
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_USER=felcra -e POSTGRES_DB=felcra postgres:17-alpine
          sleep 8
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name app --network smoke \
            -e ConnectionStrings__Default="Host=db;Database=felcra;Username=felcra;Password=smoke" \
            -e Jwt__SigningKey="smoke-test-signing-key-0123456789abcdef" "$image"
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' app)" = healthy ] && { echo "healthy"; exit 0; }
            sleep 5
          done
          docker logs app; exit 1
