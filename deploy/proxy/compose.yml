# Reverse proxy for every FELCRA stack on the server: HTTPS certificates (Let's Encrypt) are
# obtained and renewed automatically by Caddy. One site file per stack in ./sites.
#   docker network create felcra-web     (once)
#   docker compose -p felcra-proxy up -d
services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL (Let's Encrypt account e-mail)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    name: felcra-web
    external: true
